name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Verify (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Universal
            os: macos-latest
            pack_command: npm run pack:mac
            smoke_command: npm run smoke:packaged:mac
          - name: Windows x64
            os: windows-latest
            pack_command: npm run pack:win
            smoke_command: npm run smoke:packaged:win

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run syntax, unit, and stylesheet checks
        run: npm run check

      - name: Run development UI smoke test
        run: npm run smoke

      - name: Verify packaged application
        run: ${{ matrix.pack_command }}

      - name: Run packaged UI smoke test
        run: ${{ matrix.smoke_command }}
